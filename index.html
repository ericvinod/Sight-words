<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find & Circle Sight Words Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
 :root {
 --blue: #2563eb;
 --yellow: #eab308;
 --brown: #854d0e;
 --red: #dc2626;
 --pink: #ec4899;
 --green: #16a34a;
 }

 * {
 box-sizing: border-box;
 user-select: none;
 -webkit-user-select: none;
 }

 body {
 margin: 0;
 padding: 16px;
 background: linear-gradient(180deg, #dcfce7 0%, #bae6fd 60%, #86efac 100%);
 font-family: 'Comic Neue', cursive, sans-serif;
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 }

 .activity-card {
 background: #ffffff;
 width: 100%;
 max-width: 820px;
 border-radius: 28px;
 box-shadow: 0 18px 38px rgba(0,0,0,0.18);
 border: 6px solid #fde047;
 padding: 24px 20px;
 position: relative;
 }

 /* Wooden Header Banner */
 .wood-banner {
 background: linear-gradient(180deg, #e49759 0%, #b8621b 100%);
 border: 4px solid #6b330e;
 box-shadow: 0 5px 0 #451a03;
 border-radius: 20px;
 text-align: center;
 padding: 10px 18px;
 max-width: 480px;
 margin: 0 auto 10px auto;
 }

 .wood-banner h1 {
 margin: 0;
 font-family: 'Fredoka One', cursive;
 font-size: 38px;
 letter-spacing: 1px;
 background: linear-gradient(180deg, #ffffff 40%, #ffdfba 100%);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
 -webkit-text-stroke: 1.5px #6b21a8;
 filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.3));
 }

 .instruction {
 text-align: center;
 font-size: 17px;
 font-weight: 700;
 color: #1e3a8a;
 margin-bottom: 12px;
 }

 /* Side Word List & Crayons */
 .crayon-panel {
 background: #f8fafc;
 border: 3px dashed #cbd5e1;
 border-radius: 20px;
 padding: 10px 16px;
 display: flex;
 flex-wrap: wrap;
 justify-content: center;
 gap: 10px;
 margin-bottom: 16px;
 }

 .crayon-row {
 display: flex;
 align-items: center;
 gap: 8px;
 padding: 6px 14px;
 border-radius: 14px;
 cursor: pointer;
 border: 3px solid transparent;
 background: #ffffff;
 transition: all 0.15s ease;
 }

 .crayon-row.selected {
 border-color: #0284c7;
 background: #e0f2fe;
 transform: scale(1.05);
 }

 .word-label {
 font-family: 'Fredoka One', cursive;
 font-size: 24px;
 }

 .c-audio-btn {
 background: none;
 border: none;
 cursor: pointer;
 font-size: 18px;
 padding: 2px 4px;
 display: flex;
 align-items: center;
 }

 .crayon-svg {
 width: 45px;
 height: 20px;
 }

 /* Sentences Container */
 .sentence-panel {
 background: #fefce8;
 border: 3px dashed #fde047;
 border-radius: 22px;
 padding: 18px 20px;
 display: flex;
 flex-direction: column;
 gap: 14px;
 max-height: 520px;
 overflow-y: auto;
 }

 .sentence-row {
 font-size: 24px;
 font-weight: bold;
 color: #1e293b;
 display: flex;
 align-items: center;
 gap: 8px;
 flex-wrap: wrap;
 padding-bottom: 8px;
 border-bottom: 1px dashed #cbd5e1;
 }

 /* Read Entire Sentence Speaker Button */
 .btn-read-sentence {
 background: #38bdf8;
 border: 2px solid #0284c7;
 border-radius: 50%;
 width: 34px;
 height: 34px;
 display: flex;
 align-items: center;
 justify-content: center;
 cursor: pointer;
 font-size: 16px;
 box-shadow: 0 2px 0 #0284c7;
 transition: transform 0.1s;
 flex-shrink: 0;
 }

 .btn-read-sentence:active {
 transform: scale(0.92);
 }

 /* Rectangular Box Effect for Found Sight Words */
 .interactive-word {
 padding: 2px 8px;
 border-radius: 6px;
 cursor: pointer;
 border: 3px dashed transparent;
 transition: all 0.15s ease;
 }

 .interactive-word:hover {
 border-color: #94a3b8;
 }

 .interactive-word.boxed-blue   { border: 3px solid var(--blue);   background: #dbeafe; }
 .interactive-word.boxed-yellow { border: 3px solid var(--yellow); background: #fef9c3; }
 .interactive-word.boxed-brown  { border: 3px solid var(--brown);  background: #f5ebe6; }
 .interactive-word.boxed-red    { border: 3px solid var(--red);    background: #fee2e2; }
 .interactive-word.boxed-pink   { border: 3px solid var(--pink);   background: #fce7f3; }
 .interactive-word.boxed-green  { border: 3px solid var(--green);  background: #dcfce7; }

 /* Floating reward pop */
 .reward-pop {
 position: fixed;
 font-family: 'Fredoka One', cursive;
 font-size: 26px;
 color: #e11d48;
 text-shadow: 2px 2px #ffe4e6;
 pointer-events: none;
 animation: floatUp 0.8s ease-out forwards;
 z-index: 9999;
 }

 @keyframes floatUp {
 0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
 100% { opacity: 0; transform: translate(-50%, -50px) scale(1.3); }
 }
</style>
</head>
<body>

<div class="activity-card">
 <div class="wood-banner">
 <h1>Find &amp; Box</h1>
 </div>
 <div class="instruction">
 Pick a sight word crayon, listen to the pronunciation, and box the sight words in the sentences!
 </div>

 <!-- Sight Word Selector & Audio Assistance -->
 <div class="crayon-panel" id="crayons"></div>

 <!-- Sentences Container -->
 <div class="sentence-panel" id="sentenceContainer"></div>
</div>

<script>
 const SIGHT_WORDS_CONFIG = {
 like: { colorName: "red", hex: "#dc2626" },
 and:  { colorName: "green", hex: "#16a34a" },
 do:   { colorName: "pink", hex: "#ec4899" },
 you:  { colorName: "brown", hex: "#854d0e" },
 to:   { colorName: "yellow", hex: "#eab308" },
 my:   { colorName: "blue", hex: "#2563eb" }
 };

 // All 22 exact sentences from PDF without numbering or headings
 const SENTENCES = [
 "I like to skate.",
 "I like to slide.",
 "I like to dance.",
 "I like to read.",
 "I like to sleep.",
 "My bag and my bottle.",
 "The sun and the moon. C",
 "My box and my spoon.",
 "The moon and the stars.",
 "My school and my teacher.",
 "The cat and the rat.",
 "The fox and the grapes.",
 "Do you like to skate?",
 "Do you like to read?",
 "Do you like to run?",
 "Do you like to swing?",
 "Do you like to slide?",
 "I like my friend.",
 "I like my dog.",
 "I like my school.",
 "I like my teacher.",
 "I like my mom."
 ];

 let activeWord = "like";
 let activeColor = SIGHT_WORDS_CONFIG[activeWord].colorName;

 // Speech Synthesis Audio Pronunciation
 function speakText(text) {
 if ('speechSynthesis' in window) {
 window.speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.rate = 0.85;
 utterance.pitch = 1.1;
 window.speechSynthesis.speak(utterance);
 }
 }

 function playRewardChime() {
 try {
 const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
 const osc = audioCtx.createOscillator();
 const gain = audioCtx.createGain();
 osc.type = 'triangle';
 osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
 osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.15); // G5
 gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start();
 osc.stop(audioCtx.currentTime + 0.25);
 } catch (e) {
 // AudioContext fallback
 }
 }

 function triggerReward(event) {
 playRewardChime();

 // Confetti canvas effect
 if (typeof confetti === 'function') {
 const rect = event.target.getBoundingClientRect();
 const x = (rect.left + rect.width / 2) / window.innerWidth;
 const y = (rect.top + rect.height / 2) / window.innerHeight;

 confetti({
 particleCount: 30,
 spread: 50,
 startVelocity: 18,
 origin: { x, y }
 });
 }

 // Floating reward text
 const praise = ["Great Job!", "Super!", "Awesome!", "Star!", "Nice!"][Math.floor(Math.random() * 5)];
 const pop = document.createElement("div");
 pop.className = "reward-pop";
 pop.innerText = praise;
 pop.style.left = `${event.clientX}px`;
 pop.style.top = `${event.clientY}px`;
 document.body.appendChild(pop);
 setTimeout(() => pop.remove(), 800);
 }

 function getCrayonSVG(hexColor) {
 return `
 <svg class="crayon-svg" viewBox="0 0 100 35" fill="none" xmlns="http://www.w3.org/2000/svg">
 <polygon points="5,17 25,5 25,30" fill="${hexColor}" />
 <rect x="25" y="5" width="60" height="25" rx="3" fill="${hexColor}" />
 <rect x="38" y="5" width="28" height="25" fill="#f8fafc" opacity="0.4" />
 <rect x="85" y="8" width="10" height="19" rx="2" fill="#cbd5e1" />
 </svg>
 `;
 }

 function renderCrayons() {
 const crayonContainer = document.getElementById("crayons");
 crayonContainer.innerHTML = "";

 Object.keys(SIGHT_WORDS_CONFIG).forEach((word) => {
 const cfg = SIGHT_WORDS_CONFIG[word];
 const row = document.createElement("div");
 row.className = `crayon-row ${activeWord === word ? "selected" : ""}`;
 row.onclick = () => {
 activeWord = word;
 activeColor = cfg.colorName;
 document.querySelectorAll(".crayon-row").forEach(r => r.classList.remove("selected"));
 row.classList.add("selected");
 };

 row.innerHTML = `
 <span class="word-label" style="color: ${cfg.hex}">${word}</span>
 ${getCrayonSVG(cfg.hex)}
 <button class="c-audio-btn" title="Pronounce ${word}" onclick="event.stopPropagation(); speakText('${word}')">🔊</button>
 `;
 crayonContainer.appendChild(row);
 });
 }

 function renderSentences() {
 const container = document.getElementById("sentenceContainer");
 container.innerHTML = "";

 SENTENCES.forEach((sentenceText) => {
 const row = document.createElement("div");
 row.className = "sentence-row";

 // Speaker button to read the entire sentence
 const speakBtn = document.createElement("button");
 speakBtn.className = "btn-read-sentence";
 speakBtn.title = "Read Entire Sentence";
 speakBtn.innerHTML = "🔊";
 speakBtn.onclick = () => speakText(sentenceText);
 row.appendChild(speakBtn);

 // Sentence tokens/words
 const tokens = sentenceText.split(" ");
 tokens.forEach((token) => {
 if (!token) return;
 const span = document.createElement("span");
 span.className = "interactive-word";
 span.innerText = token;

 span.onclick = (e) => {
 const currentBoxClass = `boxed-${activeColor}`;
 if (span.classList.contains(currentBoxClass)) {
 span.classList.remove(currentBoxClass);
 } else {
 span.className = `interactive-word ${currentBoxClass}`;
 // Check if current clicked word matches the selected sight word
 const cleanWord = token.replace(/[^a-zA-Z]/g, "").toLowerCase();
 if (cleanWord === activeWord.toLowerCase()) {
 triggerReward(e);
 }
 }
 };

 row.appendChild(span);
 });

 container.appendChild(row);
 });
 }

 renderCrayons();
 renderSentences();
</script>
</body>
</html>
